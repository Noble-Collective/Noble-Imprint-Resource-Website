name: Build and Deploy to Cloud Run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Per-ref group so a PR's check run never cancels an in-flight production deploy.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quality gate — runs on every push AND every PR. `deploy` depends on it, so a red
  # gate blocks production. PRs run the gate but never reach the deploy job below.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'   # reuse ~/.npm across runs so `npm ci` doesn't re-download the (now large,
                         # firebase-included) dev tree every deploy — the check job's main cost.
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Verify committed editor bundle is up to date
        run: |
          npm run build:editor
          if ! git diff --exit-code --ignore-cr-at-eol src/public/js/codemirror-bundle.js; then
            echo "::error::codemirror-bundle.js is stale — run 'npm run build:editor' and commit the result."
            exit 1
          fi

  deploy:
    needs: check
    # Never deploy from a pull_request event — only pushes to main / manual dispatch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build and push image
        run: |
          export DOCKER_BUILDKIT=1
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          IMAGE=gcr.io/noble-imprint-website/resource-website
          SHA_TAG="$IMAGE:${GITHUB_SHA}"   # immutable, per-commit — the rollback target
          LATEST="$IMAGE:latest"
          # Pull the previous image as a BuildKit layer-cache source. Combined with
          # BUILDKIT_INLINE_CACHE=1 (which embeds cache metadata in the pushed image), the heavy
          # `npm ci` layer is REUSED whenever package*.json + vendor are unchanged — so a normal
          # code-only deploy skips the ~5-minute dependency install. Best-effort (|| true).
          docker pull "$LATEST" || true
          # Retry build+push so a transient registry/network blip doesn't fail the whole deploy.
          for attempt in 1 2 3; do
            echo "::group::Build & push — attempt $attempt"
            if docker build \
                 --cache-from "$LATEST" \
                 --build-arg BUILDKIT_INLINE_CACHE=1 \
                 --build-arg BUILD_TIME="$BUILD_TIME" \
                 -t "$SHA_TAG" -t "$LATEST" . \
               && docker push "$SHA_TAG" && docker push "$LATEST"; then
              echo "::endgroup::"; echo "Succeeded on attempt $attempt"; exit 0
            fi
            echo "::endgroup::"
            [ "$attempt" -lt 3 ] && { echo "Attempt $attempt failed; retrying in $((attempt * 20))s…"; sleep $((attempt * 20)); }
          done
          echo "Build & push failed after 3 attempts"; exit 1

      - name: Deploy to Cloud Run
        run: |
          # Deploy the immutable per-commit image, and PIN the known-good runtime config
          # so a redeploy can never silently reset it (values captured 2026-09-03).
          gcloud run deploy resource-website \
            --image gcr.io/noble-imprint-website/resource-website:${GITHUB_SHA} \
            --platform managed \
            --region us-central1 \
            --min-instances=0 \
            --max-instances=20 \
            --memory=512Mi \
            --cpu=1 \
            --concurrency=80 \
            --timeout=300 \
            --cpu-boost \
            --update-env-vars=FEATURE_USER_DATA=1,AUTH_UNIFIED=1 \
            --project=noble-imprint-website

      - name: Smoke check (/api/health)
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://resources.noblecollective.org/api/health || echo 000)
            echo "attempt $i: /api/health -> $code"
            [ "$code" = "200" ] && { echo "Deploy is serving."; exit 0; }
            sleep 10
          done
          echo "::error::/api/health did not return 200 after deploy — the new revision may be broken."
          exit 1

      # Content cache refresh not needed on deploy — new containers start with
      # empty in-memory cache. The runtime warm-up populates the disk cache.
      # Manual refresh still available: POST /api/refresh (requires REFRESH_SECRET)
      # Test data cleanup is dev-only (404 in production).
